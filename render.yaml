services:
  # 1. FastAPI Backend API
  - type: web
    name: beariq-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.database && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beariq-db
          property: connectionString
      - key: API_KEY_HASHES
        value: '{"be94985e0fafbb73eae2bd536b5275a76a6e8dc54eeba2d301273712222e9670":"usr_sudeep_01","475b6b708fa584209d1b682406e25f3f78b74399250185498a06d5d974ad44e4":"usr_sudeep_01","af51df92a4233cfa6a5866ca289201b515a0277c14e2aa25d0c703c7b52223d2":"usr_sudeep_01"}'
      - key: MAX_UPLOAD_BYTES
        value: 52428800
      - key: MAX_UNCOMPRESSED_BYTES
        value: 104857600
      - key: GEMINI_API_KEY
        sync: false

  # 2. Next.js Frontend
  - type: web
    name: beariq-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: beariq-backend
          property: host

databases:
  # 3. Managed PostgreSQL Database with pgvector
  - name: beariq-db
    databaseName: beariq
    user: beariq
    plan: free
