services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: beariq
      POSTGRES_PASSWORD: beariq
      POSTGRES_DB: beariq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beariq"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
